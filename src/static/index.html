<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Activity data analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 24px; }
      #filesPanel { border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px; margin-bottom: 16px; }
      #filesHeader { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
      #filesList { display: grid; grid-template-columns: 1fr; gap: 8px; }
      .fileRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px; border: 1px solid #f0f0f0; border-radius: 8px; }
      .fileLeft { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .fileName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 520px; }
      /* File colors are edited next to the filename because the color represents that file
         everywhere, not one particular chart or metric. */
      .fileColorInput { width: 34px; height: 30px; flex: 0 0 auto; padding: 2px; border: 1px solid #d8d8d8; border-radius: 6px; background: #fff; cursor: pointer; }
      .badge { font-size: 12px; padding: 2px 8px; border: 1px solid #e5e5e5; border-radius: 999px; color: #444; }
      .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      button { padding: 8px 12px; cursor: pointer; }
      .btnSmall { padding: 6px 10px; }
      .muted { color: #666; font-size: 13px; }
      .error { color: #b00020; font-size: 13px; }
      input[type="checkbox"] { transform: scale(1.1); }
      /* Grid children otherwise keep the ApexCharts canvas intrinsic width, which prevents charts
         from shrinking when the browser narrows even though they grow correctly with the window. */
      .row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
      .card { min-width: 0; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px; }
      #chartHr, #chartSpeed, #chartPower { width: 100%; min-width: 0; }
      .analyticsHeader { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
      .analyticsControls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .analyticsToggle { display: inline-flex; align-items: center; gap: 6px; color: #444; font-size: 13px; white-space: nowrap; }
      .analyticsTableWrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { padding: 8px 10px; border-bottom: 1px solid #eeeeee; text-align: right; white-space: nowrap; }
      th:first-child, td:first-child, th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3) { text-align: left; }
      th { color: #444; font-weight: 650; background: #fafafa; }
      .bestCell { background: #eaf7ed; color: #146c2e; font-weight: 700; }
      .analyticsEmpty { padding: 8px 0; }
      .metricHeader { display: inline-flex; align-items: center; justify-content: flex-end; gap: 5px; }
      .metricHelp { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border: 1px solid #cfcfcf; border-radius: 50%; color: #555; background: #fff; font-size: 11px; line-height: 1; cursor: help; }
      .metricHelp:focus { outline: 2px solid #8ab4f8; outline-offset: 2px; }
      #metricTooltip { position: fixed; z-index: 1000; max-width: 280px; padding: 8px 10px; border: 1px solid #d8d8d8; border-radius: 8px; background: #222; color: #fff; font-size: 12px; font-weight: 400; line-height: 1.35; text-align: left; white-space: normal; box-shadow: 0 6px 18px rgba(0,0,0,0.18); opacity: 0; pointer-events: none; transform: translateY(4px); transition: opacity 120ms ease, transform 120ms ease; }
      #metricTooltip.visible { opacity: 1; transform: translateY(0); }
      /* Annotation controls sit below comparison analytics so users can mark ranges without
         displacing the existing chart/table workflow that the comparison review depends on. */
      .annotationsPanel { display: grid; gap: 12px; }
      .annotationsHeader { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .annotationForm { display: grid; gap: 10px; padding: 12px; border: 1px solid #eeeeee; border-radius: 8px; background: #fbfbfb; }
      .annotationForm[hidden] { display: none; }
      .annotationFormTop { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .annotationField { display: grid; gap: 5px; font-size: 13px; color: #444; }
      .annotationNameField { flex: 1 1 260px; max-width: 420px; }
      .annotationField input[type="text"] { padding: 8px 10px; border: 1px solid #d8d8d8; border-radius: 6px; font: inherit; }
      .annotationColorField { min-width: 92px; }
      .annotationColorInput { width: 52px; height: 38px; padding: 3px; border: 1px solid #d8d8d8; border-radius: 6px; background: #fff; cursor: pointer; }
      .rangeSliders { display: grid; gap: 8px; padding-top: 4px; }
      .timelineRangeSlider { position: relative; height: 34px; touch-action: none; }
      .timelineRangeTrack { position: absolute; left: var(--annotation-slider-left-pad, 8px); right: var(--annotation-slider-right-pad, 8px); top: 15px; height: 4px; border-radius: 999px; background: #e2e2e2; }
      .timelineRangeFill { position: absolute; top: 0; bottom: 0; border-radius: 999px; background: #9aa6b8; }
      .timelineRangeHandle { position: absolute; top: 50%; width: 18px; height: 18px; padding: 0; border: 2px solid #69758a; border-radius: 50%; background: #ffffff; transform: translate(-50%, -50%); cursor: grab; z-index: 2; }
      .timelineRangeHandle:active, .timelineRangeHandle.dragging { cursor: grabbing; }
      .timelineRangeHandle:focus { outline: 2px solid #8ab4f8; outline-offset: 2px; }
      .rangeSliderLabels { display: flex; justify-content: space-between; gap: 12px; }
      .annotationList { display: grid; gap: 8px; }
      .annotationItem { display: grid; gap: 10px; padding: 8px; border: 1px solid #eeeeee; border-radius: 8px; }
      .annotationItemSummary { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .annotationItemSummary.hiddenWhileEditing { display: none; }
      .annotationItemName { font-weight: 650; }
      .annotationItemMeta { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .annotationColorSwatch { width: 14px; height: 14px; flex: 0 0 auto; border: 1px solid rgba(0,0,0,0.18); border-radius: 50%; background: var(--annotation-color, #D8DEE8); }
      .annotationForm .actions, .annotationItemSummary .actions { margin-left: auto; justify-content: flex-end; }
      @media (max-width: 720px) {
        .annotationFormTop { align-items: stretch; flex-direction: column; }
        .annotationNameField { max-width: none; }
        .annotationItemSummary { align-items: flex-start; flex-direction: column; }
        .annotationForm .actions, .annotationItemSummary .actions { margin-left: 0; justify-content: flex-start; }
      }
      /* The processing overlay covers the slow parse/render gap so users get immediate feedback after choosing files. */
      #processingOverlay { position: fixed; inset: 0; z-index: 900; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(255,255,255,0.74); backdrop-filter: blur(2px); }
      #processingOverlay.visible { display: flex; }
      .processingBox { display: inline-flex; align-items: center; gap: 12px; min-width: 240px; max-width: min(360px, 100%); padding: 14px 16px; border: 1px solid #dddddd; border-radius: 8px; background: #ffffff; box-shadow: 0 12px 30px rgba(0,0,0,0.14); color: #222; font-size: 14px; }
      .processingSpinner { width: 22px; height: 22px; flex: 0 0 auto; border: 3px solid #e4e4e4; border-top-color: #1f6feb; border-radius: 50%; animation: processingSpin 800ms linear infinite; }
      @keyframes processingSpin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="filesPanel">
      <div id="filesHeader">
        <div>
          <strong>Files</strong>
          <span id="filesCount" class="muted"></span>
          <span id="status" class="muted"></span>
        </div>

        <div class="actions">
          <input id="fileInput" type="file" multiple accept=".fit,.tcx" style="display:none" />
          <button id="addFilesBtn">Add files</button>
          <button id="enableAllBtn" class="btnSmall">Show all</button>
          <button id="disableAllBtn" class="btnSmall">Hide all</button>
          <button id="clearBtn" class="btnSmall">Clear</button>
        </div>
      </div>

      <div id="filesList"></div>
      <div id="filesError" class="error"></div>
    </div>

    <div class="row">
      <div class="card">
        <div class="analyticsHeader">
          <div>
            <strong>Comparison analytics</strong>
            <span class="muted">choose the file used as the comparison baseline</span>
          </div>
          <div class="analyticsControls">
            <label class="analyticsToggle" title="Show and compare only the common time window available in all enabled files.">
              <input id="trimToShortestInput" type="checkbox" />
              <span>Analyze common period</span>
            </label>
            <label class="analyticsToggle" title="Switch chart X-axis between wall-clock time and elapsed time from the activity/common-period start.">
              <span>Chart time</span>
              <select id="chartTimeModeSelect">
                <option value="absolute">Absolute</option>
                <option value="elapsed">From start</option>
              </select>
            </label>
            <span id="analyticsStatus" class="muted"></span>
          </div>
        </div>
      </div>
      <!-- The annotation editor is explicit instead of prompt-based so saved x-axis ranges have
           visible names, editable bounds, and live feedback before they affect the chart review. -->
      <div class="card">
        <div class="annotationsPanel">
          <div class="annotationsHeader">
            <div>
              <strong>Annotations</strong>
              <span id="annotationsStatus" class="muted"></span>
            </div>
            <button id="addAnnotationBtn" class="btnSmall">Add</button>
          </div>
          <div id="annotationsList" class="annotationList"></div>
          <div id="annotationForm" class="annotationForm" hidden>
            <div class="annotationFormTop">
              <label class="annotationField annotationNameField">
                <span>Name</span>
                <input id="annotationNameInput" type="text" placeholder="Interval name" />
              </label>
              <!-- The color picker makes annotation meaning editable per interval instead of
                   forcing every saved chart range to share the same neutral overlay color. -->
              <label class="annotationField annotationColorField">
                <span>Color</span>
                <input id="annotationColorInput" class="annotationColorInput" type="color" />
              </label>
              <div class="actions">
                <button id="saveAnnotationBtn" class="btnSmall">Save</button>
                <button id="cancelAnnotationBtn" class="btnSmall" type="button">Cancel</button>
              </div>
            </div>
            <div class="annotationField">
              <span>Range</span>
              <div class="rangeSliders">
                <div id="annotationRangeSlider" class="timelineRangeSlider" aria-label="Annotation range">
                  <div class="timelineRangeTrack">
                    <div id="annotationRangeFill" class="timelineRangeFill"></div>
                  </div>
                  <button id="annotationStartHandle" class="timelineRangeHandle" type="button" role="slider" aria-label="Start" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="0"></button>
                  <button id="annotationEndHandle" class="timelineRangeHandle" type="button" role="slider" aria-label="End" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="1000"></button>
                </div>
                <div class="rangeSliderLabels">
                  <span class="muted">Start: <span id="annotationStartLabel">-</span></span>
                  <span class="muted">End: <span id="annotationEndLabel">-</span></span>
                </div>
              </div>
            </div>
            <div id="annotationFormError" class="error"></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div id="chartHr"></div>
        <div id="analyticsTableHr"></div>
      </div>
      <div class="card">
        <div id="chartSpeed"></div>
        <div id="analyticsTableSpeed"></div>
      </div>
      <div class="card">
        <div id="chartPower"></div>
        <div id="analyticsTablePower"></div>
      </div>
    </div>
    <div id="metricTooltip" role="tooltip"></div>
    <!-- This status layer makes long file parsing visible instead of leaving the page looking idle. -->
    <div id="processingOverlay" role="status" aria-live="polite" aria-hidden="true">
      <div class="processingBox">
        <span class="processingSpinner" aria-hidden="true"></span>
        <span id="processingMessage">Processing data...</span>
      </div>
    </div>

    <script>
      let currentChartTimeMode = "absolute";

      function chartTimestampFromFormatterValue(value, timestamp) {
        if (Number.isFinite(Number(timestamp))) return Number(timestamp);

        const numericValue = Number(value);
        if (Number.isFinite(numericValue)) return numericValue;

        const parsedValue = Date.parse(value);
        return Number.isFinite(parsedValue) ? parsedValue : null;
      }

      // ApexCharts can fall back to dense or UTC-looking datetime labels; formatting timestamps
      // ourselves keeps the chart axis and tooltip readable and tied to the user's local timezone.
      function formatChartTimestamp(value, timestamp, includeDate = false) {
        const timestampMs = chartTimestampFromFormatterValue(value, timestamp);
        if (timestampMs === null) return "";

        const date = new Date(timestampMs);
        const dateOptions = includeDate
          ? { month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" }
          : { hour: "2-digit", minute: "2-digit", second: "2-digit" };
        return new Intl.DateTimeFormat(undefined, {
          ...dateOptions,
          hour12: false,
          hourCycle: "h23"
        }).format(date);
      }

      function formatElapsedAxisMilliseconds(milliseconds) {
        if (!Number.isFinite(Number(milliseconds))) return "";
        const totalSeconds = Math.max(0, Math.floor(Number(milliseconds) / 1000));
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        const paddedMinutes = String(minutes).padStart(2, "0");
        const paddedSeconds = String(seconds).padStart(2, "0");
        return hours > 0 ? `${hours}:${paddedMinutes}:${paddedSeconds}` : `${minutes}:${paddedSeconds}`;
      }

      function formatChartXValue(value, timestamp, includeDate = false) {
        if (currentChartTimeMode === "elapsed") {
          return formatElapsedAxisMilliseconds(chartTimestampFromFormatterValue(value, timestamp));
        }
        return formatChartTimestamp(value, timestamp, includeDate);
      }

      function chartXAxisBaseOptions(type) {
        return {
          type,
          tooltip: { enabled: true },
          labels: {
            datetimeUTC: false,
            formatter: function(value, timestamp) {
              return formatChartXValue(value, timestamp);
            }
          }
        };
      }

      function makeChartOptions(title) {
        return {
          chart: {
            type: "line",
            height: 320,
            animations: { enabled: false },
            zoom: { enabled: true },
            toolbar: { show: true }
          },
          stroke: { width: 2 },
          title: { text: title },
          xaxis: chartXAxisBaseOptions("datetime"),
          series: [],
          tooltip: {
            shared: true,
            intersect: false,
            custom: function(customTooltipContext) {
              const seriesIndexForHoveredPoint = customTooltipContext.seriesIndex;
              const dataPointIndexForSharedTooltip = customTooltipContext.dataPointIndex;
              const chartContext = customTooltipContext.w;
              if (seriesIndexForHoveredPoint < 0 || dataPointIndexForSharedTooltip < 0) return "";

              const xValueForHoveredPoint = chartContext.globals.seriesX[seriesIndexForHoveredPoint][dataPointIndexForSharedTooltip];
              const roundedHoveredTimeInMilliseconds = Math.floor(xValueForHoveredPoint / 1000) * 1000;
              const tooltipLines = [];

              for (let currentSeriesIndex = 0; currentSeriesIndex < chartContext.globals.series.length; currentSeriesIndex++) {
                const seriesNameForTooltip = chartContext.globals.seriesNames[currentSeriesIndex];
                const xValuesForCurrentSeries = chartContext.globals.seriesX[currentSeriesIndex] || [];
                const seriesValuesForCurrentSeries = chartContext.globals.series[currentSeriesIndex] || [];
                let seriesValueForTooltip = "-";

                for (let currentSeriesDataPointIndex = 0; currentSeriesDataPointIndex < xValuesForCurrentSeries.length; currentSeriesDataPointIndex++) {
                  const roundedSeriesPointTimeInMilliseconds = Math.floor(xValuesForCurrentSeries[currentSeriesDataPointIndex] / 1000) * 1000;
                  if (roundedSeriesPointTimeInMilliseconds === roundedHoveredTimeInMilliseconds) {
                    const valueAtMatchedTime = seriesValuesForCurrentSeries[currentSeriesDataPointIndex];
                    seriesValueForTooltip = valueAtMatchedTime === undefined ? "-" : valueAtMatchedTime;
                    break;
                  }
                }

                tooltipLines.push(`<div><span>${seriesNameForTooltip}:</span> <strong>${seriesValueForTooltip}</strong></div>`);
              }

              if (!tooltipLines.length) return "";

              const timeLabelForTooltip = formatChartXValue(roundedHoveredTimeInMilliseconds, roundedHoveredTimeInMilliseconds, true);
              return `<div class="apexcharts-tooltip-title">${timeLabelForTooltip}</div>${tooltipLines.join("")}`;
            }
          },
          legend: { position: "top" },
          noData: { text: "No data" }
        };
      }

      const chartHr = new ApexCharts(document.querySelector("#chartHr"), makeChartOptions("Heart rate (bpm)"));
      const chartSpeed = new ApexCharts(document.querySelector("#chartSpeed"), makeChartOptions("Speed (km/h)"));
      const chartPower = new ApexCharts(document.querySelector("#chartPower"), makeChartOptions("Power (W)"));
      chartHr.render();
      chartSpeed.render();
      chartPower.render();

      const ui = {
        fileInput: document.querySelector("#fileInput"),
        addFilesBtn: document.querySelector("#addFilesBtn"),
        status: document.querySelector("#status"),
        filesList: document.querySelector("#filesList"),
        filesCount: document.querySelector("#filesCount"),
        filesError: document.querySelector("#filesError"),
        enableAllBtn: document.querySelector("#enableAllBtn"),
        disableAllBtn: document.querySelector("#disableAllBtn"),
        clearBtn: document.querySelector("#clearBtn"),
        analyticsTables: {
          hr_bpm: document.querySelector("#analyticsTableHr"),
          speed_kmh: document.querySelector("#analyticsTableSpeed"),
          power_w: document.querySelector("#analyticsTablePower"),
        },
        analyticsStatus: document.querySelector("#analyticsStatus"),
        trimToShortestInput: document.querySelector("#trimToShortestInput"),
        chartTimeModeSelect: document.querySelector("#chartTimeModeSelect"),
        annotationsStatus: document.querySelector("#annotationsStatus"),
        annotationsPanel: document.querySelector(".annotationsPanel"),
        addAnnotationBtn: document.querySelector("#addAnnotationBtn"),
        annotationForm: document.querySelector("#annotationForm"),
        annotationNameInput: document.querySelector("#annotationNameInput"),
        annotationColorInput: document.querySelector("#annotationColorInput"),
        annotationRangeSlider: document.querySelector("#annotationRangeSlider"),
        annotationRangeFill: document.querySelector("#annotationRangeFill"),
        annotationStartHandle: document.querySelector("#annotationStartHandle"),
        annotationEndHandle: document.querySelector("#annotationEndHandle"),
        annotationStartLabel: document.querySelector("#annotationStartLabel"),
        annotationEndLabel: document.querySelector("#annotationEndLabel"),
        saveAnnotationBtn: document.querySelector("#saveAnnotationBtn"),
        cancelAnnotationBtn: document.querySelector("#cancelAnnotationBtn"),
        annotationFormError: document.querySelector("#annotationFormError"),
        annotationsList: document.querySelector("#annotationsList"),
        metricTooltip: document.querySelector("#metricTooltip"),
        processingOverlay: document.querySelector("#processingOverlay"),
        processingMessage: document.querySelector("#processingMessage"),
      };

      const SUPPORTED_METRICS = ["hr_bpm", "speed_kmh", "power_w"];
      const METRIC_LABELS = {
        hr_bpm: "Heart rate",
        speed_kmh: "Speed",
        power_w: "Power"
      };
      const METRIC_UNITS = {
        hr_bpm: "bpm",
        speed_kmh: "km/h",
        power_w: "W"
      };
      // Default annotation colors keep new intervals visible on the chart before the user
      // customizes them, and are reused as a safe fallback for older saved in-memory objects.
      const DEFAULT_ANNOTATION_COLOR = "#d8dee8";
      const DEFAULT_DRAFT_ANNOTATION_COLOR = "#e8d8b8";
      // New files get distinct defaults so chart lines are readable immediately, while the
      // per-file picker still lets users override the color used across every metric chart.
      const DEFAULT_FILE_COLORS = [
        "#2563eb",
        "#dc2626",
        "#16a34a",
        "#9333ea",
        "#ea580c",
        "#0891b2",
        "#be123c",
        "#4f46e5"
      ];
      const ANALYTICS_COLUMN_HELP = {
        "Compared file": "The enabled file being measured against the selected reference.",
        Samples: "Number of matched timestamp points used in the calculation. Trim mode first cuts each metric to the common time window.",
        Window: "Number of seconds included in the active analysis window for this metric and file pair. It shrinks when Analyze common period removes leading or trailing samples.",
        Trimmed: "Seconds removed from the full pair window by Analyze common period. A non-zero value confirms the table is comparing only the shared period.",
        // "Shared coverage" describes the intersection-over-union timestamp calculation more
        // precisely than "Overlap" while staying short enough for the dense analytics table.
        "Shared coverage": "Shared timestamp coverage: share of all seconds in the active analysis window that exist in both files. In full mode, extra leading/trailing recording time lowers this value; Analyze common period removes those tails first.",
        Similarity: "Composite score from curve shape, RMSE, bias, and shared timestamp coverage. Higher means the compared file behaves more like the reference across the active analysis window.",
        Correlation: "Pearson correlation between matched values. Higher means both curves rise and fall together more consistently.",
        MAE: "Mean absolute error: the average absolute difference from the reference in the metric's native unit. Lower is better.",
        RMSE: "Root mean squared error: like MAE but penalizes large spikes more strongly. Lower is better.",
        Bias: "Average signed difference: positive means the compared file is higher than reference, negative means lower.",
        "Max diff": "Largest absolute difference observed between matched points. Lower means fewer extreme deviations."
      };

      // referenceKey stores an explicit comparison baseline so analytics do not depend on
      // the visual sort order of uploaded files, which can change as files are added.
      // trimToShortest limits charts and analytics to the shared time window so extra leading
      // or trailing samples from one recorder do not dominate similarity metrics.
      const state = {
        files: new Map(),
        referenceKey: null,
        trimToShortest: false,
        chartTimeMode: "absolute",
        // Annotations are stored in source timestamps so saved ranges survive chart-time switches
        // and can be redrawn correctly on every metric chart that currently has visible data.
        annotations: [],
        annotationDraft: null,
        isProcessing: false
      };
      // Drag state is kept outside app data because it only controls pointer interaction; this
      // prevents temporary mouse/touch movement from becoming saved annotation state.
      const annotationDragState = {
        activeHandle: null,
        capturedElement: null,
        animationFrame: null,
        previewInFlight: false,
        previewPending: false
      };
      // The latest rendered series are cached so dragging an annotation can update only the
      // ApexCharts overlay, avoiding expensive series/table rebuilds on every pointer move.
      const renderedChartSeries = {
        hr_bpm: [],
        speed_kmh: [],
        power_w: []
      };

      function formatBytes(bytes) {
        const units = ["B","KB","MB","GB"];
        let value = bytes;
        let idx = 0;
        while (value >= 1024 && idx < units.length - 1) { value /= 1024; idx++; }
        return `${value.toFixed(idx === 0 ? 0 : 1)} ${units[idx]}`;
      }

      function makeFileKey(file) {
        return `${file.name}::${file.size}::${file.lastModified}`;
      }

      function setStatus(text) {
        ui.status.textContent = text ? ` · ${text}` : "";
      }

      function setError(text) {
        ui.filesError.textContent = text || "";
      }

      function setProcessingState(isProcessing, message = "Processing data...") {
        // The overlay is tied to the full parse-and-render cycle so users see that selected
        // files are still being converted into chart series and comparison tables.
        state.isProcessing = isProcessing;
        ui.processingMessage.textContent = message;
        ui.processingOverlay.classList.toggle("visible", isProcessing);
        ui.processingOverlay.setAttribute("aria-hidden", isProcessing ? "false" : "true");
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // Attribute values need quote escaping too because file names can contain quotes;
      // without this, a title/data attribute could be broken by a valid local filename.
      function escapeAttribute(text) {
        return escapeHtml(text).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      function enabledFiles() {
        return Array.from(state.files.values()).filter(f => f.enabled);
      }

      function normalizedFileColor(color, fallbackColor = DEFAULT_FILE_COLORS[0]) {
        // File colors are injected into ApexCharts and inline input values, so keep only picker-
        // compatible hex values and recover safely if older state objects have no color yet.
        return /^#[0-9a-f]{6}$/i.test(String(color || "")) ? String(color).toLowerCase() : fallbackColor;
      }

      function defaultFileColor() {
        // Cycling the palette gives each newly added file a deterministic visible line color
        // before the user chooses a custom color beside the filename.
        return DEFAULT_FILE_COLORS[state.files.size % DEFAULT_FILE_COLORS.length];
      }

      function currentReferenceFile(requireEnabled = true) {
        if (state.referenceKey) {
          const selectedReference = state.files.get(state.referenceKey);
          if (selectedReference && (!requireEnabled || selectedReference.enabled)) return selectedReference;
        }

        return enabledFiles()[0] || null;
      }

      // If the selected reference is removed or individually disabled, fall back to an enabled file;
      // when everything is disabled, keep the chosen key so Enable all restores the user's baseline.
      function ensureReferenceKey() {
        const selectedReference = currentReferenceFile(false);
        if (selectedReference && !selectedReference.enabled && !enabledFiles().length) {
          state.referenceKey = selectedReference.key;
          return;
        }

        const currentReference = currentReferenceFile();
        state.referenceKey = currentReference ? currentReference.key : null;
      }

      function updateFilesHeader() {
        const total = state.files.size;
        const enabled = enabledFiles().length;
        ui.filesCount.textContent = total ? `(${enabled}/${total} visible)` : "(0)";
        ui.addFilesBtn.textContent = total ? "Add more files" : "Add files";
      }

      function renderFilesList() {
        updateFilesHeader();

        if (state.files.size === 0) {
          ui.filesList.innerHTML = `<div class="muted">No files added</div>`;
          return;
        }

        const items = Array.from(state.files.values()).sort((a, b) => a.name.localeCompare(b.name));
        ensureReferenceKey();

        ui.filesList.innerHTML = items.map(item => {
          const ext = item.name.toLowerCase().endsWith(".fit") ? "FIT" : (item.name.toLowerCase().endsWith(".tcx") ? "TCX" : "FILE");
          const isReference = item.key === state.referenceKey;
          const visibilityButtonText = item.enabled ? "Hide" : "Show";
          const fileColor = normalizedFileColor(item.color);
          // The active reference button explains why it is disabled, so users can distinguish
          // the chosen baseline from a temporarily unavailable action.
          const referenceButtonText = isReference ? "Used as reference" : "Set reference";
          return `
            <div class="fileRow" data-key="${escapeAttribute(item.key)}">
              <div class="fileLeft">
                <span class="fileName" title="${escapeAttribute(item.name)}">${escapeHtml(item.name)}</span>
                <input class="fileColorInput" type="color" value="${escapeAttribute(fileColor)}" title="File color" aria-label="Color for ${escapeAttribute(item.name)}" data-action="change-color" />
                <span class="badge">${ext}</span>
                ${isReference ? `<span class="badge">Reference</span>` : ""}
                ${item.enabled ? "" : `<span class="badge">Hidden</span>`}
                <span class="muted">${formatBytes(item.size)}</span>
              </div>
              <div class="actions">
                <button class="btnSmall" data-action="set-reference" ${isReference ? "disabled" : ""}>${referenceButtonText}</button>
                <button class="btnSmall" data-action="toggle-visibility">${visibilityButtonText}</button>
                <button class="btnSmall" data-action="remove">Remove</button>
              </div>
            </div>
          `;
        }).join("");

        ui.filesList.querySelectorAll(".fileRow").forEach(row => {
          row.addEventListener("click", async (ev) => {
            const target = ev.target;
            if (!(target instanceof HTMLElement)) return;

            const key = row.getAttribute("data-key");
            if (!key) return;

            const action = target.getAttribute("data-action");
            if (!action) return;

            if (action === "toggle-visibility") {
              ev.stopPropagation();
              const fileItem = state.files.get(key);
              if (!fileItem) return;
              // Hide/show keeps uploaded data in memory while excluding hidden files from
              // charts and analytics, which is faster than removing and re-uploading them.
              fileItem.enabled = !fileItem.enabled;
              ensureReferenceKey();
              updateFilesHeader();
              renderFilesList();
              await updateChartsFromState();
              return;
            }

            if (action === "set-reference") {
              ev.stopPropagation();
              const fileItem = state.files.get(key);
              if (!fileItem) return;
              // Choosing a reference also enables that file because comparison metrics need
              // a visible, parsed baseline that participates in the current analysis set.
              fileItem.enabled = true;
              state.referenceKey = key;
              renderFilesList();
              await updateChartsFromState();
              return;
            }

            if (action === "remove") {
              ev.stopPropagation();
              state.files.delete(key);
              ensureReferenceKey();
              renderFilesList();
              await updateChartsFromState();
              return;
            }
          });

          row.querySelectorAll(".fileColorInput").forEach(colorInput => {
            colorInput.addEventListener("input", async (ev) => {
              ev.stopPropagation();
              const fileItem = state.files.get(row.getAttribute("data-key") || "");
              if (!fileItem) return;
              // Updating the file object is enough because every chart render derives its color
              // array from enabled files in series order, keeping all metrics synchronized.
              fileItem.color = normalizedFileColor(colorInput.value, fileItem.color);
              await updateChartsFromState();
            });
          });
        });
      }

      async function fetchParsedSeries(files) {
        const formData = new FormData();
        for (const file of files) formData.append("files", file);

        const response = await fetch("/api/parse", { method: "POST", body: formData });
        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || "Parse failed");
        }
        return response.json();
      }

      function buildSeriesLookup(resultJson) {
        const series = (resultJson && resultJson.series) || {};
        const lookup = {};
        for (const metric of SUPPORTED_METRICS) {
          lookup[metric] = new Map();
          const arr = Array.isArray(series[metric]) ? series[metric] : [];
          for (const s of arr) {
            if (s && typeof s.name === "string") lookup[metric].set(s.name, s);
          }
        }
        return lookup;
      }

      async function addSelectedFiles(fileList) {
        setError("");

        const filesToParse = [];
        for (const file of fileList) {
          const lower = file.name.toLowerCase();
          if (!lower.endsWith(".fit") && !lower.endsWith(".tcx")) continue;
          const key = makeFileKey(file);
          if (state.files.has(key)) continue;
          filesToParse.push(file);
        }

        if (!filesToParse.length) {
          return;
        }

        ui.addFilesBtn.disabled = true;
        ui.enableAllBtn.disabled = true;
        ui.disableAllBtn.disabled = true;
        ui.clearBtn.disabled = true;
        setProcessingState(true, `Processing ${filesToParse.length} file(s)...`);

        try {
          setStatus(`Parsing ${filesToParse.length} file(s)`);
          const result = await fetchParsedSeries(filesToParse);
          const lookup = buildSeriesLookup(result);

          for (const file of filesToParse) {
            const key = makeFileKey(file);
            state.files.set(key, {
              key,
              name: file.name,
              size: file.size,
              lastModified: file.lastModified,
              enabled: true,
              color: defaultFileColor(),
              parsedSeries: {
                hr_bpm: lookup.hr_bpm.get(file.name) || { name: file.name, data: [] },
                speed_kmh: lookup.speed_kmh.get(file.name) || { name: file.name, data: [] },
                power_w: lookup.power_w.get(file.name) || { name: file.name, data: [] },
              }
            });
            if (!state.referenceKey) state.referenceKey = key;
          }

          renderFilesList();
          await updateChartsFromState();
          setStatus("");
        } catch (err) {
          setStatus("");
          setError(err instanceof Error ? err.message : "Parse error");
        } finally {
          setProcessingState(false);
          ui.addFilesBtn.disabled = false;
          ui.enableAllBtn.disabled = false;
          ui.disableAllBtn.disabled = false;
          ui.clearBtn.disabled = false;
        }
      }

      function seriesForMetric(metric) {
        const result = [];
        for (const item of enabledFiles()) {
          const s = item.parsedSeries[metric];
          if (s && Array.isArray(s.data) && s.data.length) result.push(s);
        }
        return result;
      }

      function seriesTimeBounds(series) {
        if (!series || !Array.isArray(series.data)) return null;
        let minTimestampMs = Infinity;
        let maxTimestampMs = -Infinity;
        let validTimestamps = 0;

        for (const point of series.data) {
          const timestampMs = Array.isArray(point) ? Number(point[0]) : NaN;
          if (!Number.isFinite(timestampMs)) continue;
          minTimestampMs = Math.min(minTimestampMs, timestampMs);
          maxTimestampMs = Math.max(maxTimestampMs, timestampMs);
          validTimestamps += 1;
        }

        if (validTimestamps < 2) return null;
        return { minTimestampMs, maxTimestampMs };
      }

      function commonMetricTimeBounds(files, metric) {
        const boundsByFile = files
          .map(file => seriesTimeBounds(file.parsedSeries[metric]))
          .filter(bounds => bounds !== null);
        if (!boundsByFile.length) return null;

        const minTimestampMs = Math.max(...boundsByFile.map(bounds => bounds.minTimestampMs));
        const maxTimestampMs = Math.min(...boundsByFile.map(bounds => bounds.maxTimestampMs));
        if (maxTimestampMs < minTimestampMs) return null;
        return { minTimestampMs, maxTimestampMs };
      }

      function fileTimeBounds(file) {
        const metricBounds = SUPPORTED_METRICS
          .map(metric => seriesTimeBounds(file.parsedSeries[metric]))
          .filter(bounds => bounds !== null);
        if (!metricBounds.length) return null;

        return {
          minTimestampMs: Math.min(...metricBounds.map(bounds => bounds.minTimestampMs)),
          maxTimestampMs: Math.max(...metricBounds.map(bounds => bounds.maxTimestampMs))
        };
      }

      function commonEnabledFilesTimeBounds() {
        const boundsByFile = enabledFiles()
          .map(file => fileTimeBounds(file))
          .filter(bounds => bounds !== null);
        if (boundsByFile.length < 2) return null;

        const minTimestampMs = Math.max(...boundsByFile.map(bounds => bounds.minTimestampMs));
        const maxTimestampMs = Math.min(...boundsByFile.map(bounds => bounds.maxTimestampMs));
        if (maxTimestampMs < minTimestampMs) return null;
        return { minTimestampMs, maxTimestampMs };
      }

      function enabledFilesTimeBounds() {
        const boundsByFile = enabledFiles()
          .map(file => fileTimeBounds(file))
          .filter(bounds => bounds !== null);
        if (!boundsByFile.length) return null;

        return {
          minTimestampMs: Math.min(...boundsByFile.map(bounds => bounds.minTimestampMs)),
          maxTimestampMs: Math.max(...boundsByFile.map(bounds => bounds.maxTimestampMs))
        };
      }

      function annotationSelectionBounds() {
        // The annotation editor follows the same visible-window idea as the analytics controls:
        // common-period mode limits new ranges to the shared window, while full mode allows the
        // complete enabled-file timeline so users can mark leading/trailing regions too.
        return state.trimToShortest ? commonEnabledFilesTimeBounds() : enabledFilesTimeBounds();
      }

      function clampTimestampToBounds(timestampMs, bounds) {
        if (!bounds || !Number.isFinite(timestampMs)) return timestampMs;
        return Math.min(Math.max(timestampMs, bounds.minTimestampMs), bounds.maxTimestampMs);
      }

      function normalizedAnnotationColor(color, fallbackColor = DEFAULT_ANNOTATION_COLOR) {
        // Annotation color is user-editable and later injected into chart/DOM styles, so accept
        // only hex colors from the picker and fall back safely for older annotations without color.
        return /^#[0-9a-f]{6}$/i.test(String(color || "")) ? String(color).toLowerCase() : fallbackColor;
      }

      function timestampFromSliderValue(sliderValue, bounds) {
        if (!bounds) return null;
        const ratio = Math.min(Math.max(Number(sliderValue) / 1000, 0), 1);
        return bounds.minTimestampMs + (bounds.maxTimestampMs - bounds.minTimestampMs) * ratio;
      }

      function sliderValueFromTimestamp(timestampMs, bounds) {
        if (!bounds || bounds.maxTimestampMs === bounds.minTimestampMs) return 0;
        const clampedTimestampMs = clampTimestampToBounds(timestampMs, bounds);
        return Math.round(((clampedTimestampMs - bounds.minTimestampMs) / (bounds.maxTimestampMs - bounds.minTimestampMs)) * 1000);
      }

      function formatAnnotationTimestamp(timestampMs) {
        if (!Number.isFinite(timestampMs)) return "-";
        return state.chartTimeMode === "elapsed"
          ? formatDurationMilliseconds(timestampMs - (annotationSelectionBounds()?.minTimestampMs || timestampMs))
          : formatChartTimestamp(timestampMs, timestampMs, true);
      }

      function formatDurationMilliseconds(durationMs) {
        if (!Number.isFinite(durationMs) || durationMs < 0) return "-";
        const totalSeconds = Math.floor(durationMs / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        const paddedMinutes = String(minutes).padStart(2, "0");
        const paddedSeconds = String(seconds).padStart(2, "0");
        return hours > 0 ? `${hours}:${paddedMinutes}:${paddedSeconds}` : `${minutes}:${paddedSeconds}`;
      }

      function formatDurationSeconds(durationSeconds) {
        if (!Number.isFinite(durationSeconds) || durationSeconds < 0) return "-";
        return formatDurationMilliseconds(durationSeconds * 1000);
      }

      // The header shows the shared file-level period instead of repeating the selected reference,
      // because reference is already visible in the file list and this duration explains trim impact.
      function analyticsStatusText() {
        const commonBounds = commonEnabledFilesTimeBounds();
        if (!commonBounds) return "";
        return `common period: ${formatDurationMilliseconds(commonBounds.maxTimestampMs - commonBounds.minTimestampMs)}`;
      }

      // This aligns series by whole seconds because device exports often differ by milliseconds;
      // trim bounds remove extra leading or trailing samples before scores are calculated.
      function pointsBySecond(series, options = {}) {
        const result = new Map();
        if (!series || !Array.isArray(series.data)) return result;

        const trimBounds = options.trimBounds || null;

        for (const point of series.data) {
          if (!Array.isArray(point) || point.length < 2) continue;
          const timestampMs = Number(point[0]);
          const value = Number(point[1]);
          if (!Number.isFinite(timestampMs) || !Number.isFinite(value)) continue;
          if (trimBounds && (timestampMs < trimBounds.minTimestampMs || timestampMs > trimBounds.maxTimestampMs)) continue;
          const second = Math.floor(timestampMs / 1000);
          result.set(second, value);
        }

        return result;
      }

      // These metrics combine error, bias, overlap and shape agreement so the table can surface
      // both "how close are values" and "do the curves behave similarly" in one place.
      function compareSeries(referenceSeries, candidateSeries, options = {}) {
        const pointOptions = { trimBounds: options.trimBounds };
        const fullReferenceBySecond = pointsBySecond(referenceSeries);
        const fullCandidateBySecond = pointsBySecond(candidateSeries);
        const referenceBySecond = pointsBySecond(referenceSeries, pointOptions);
        const candidateBySecond = pointsBySecond(candidateSeries, pointOptions);
        const paired = [];

        for (const [second, referenceValue] of referenceBySecond.entries()) {
          if (!candidateBySecond.has(second)) continue;
          paired.push([referenceValue, candidateBySecond.get(second)]);
        }

        if (!paired.length) return null;

        let absErrorSum = 0;
        let squaredErrorSum = 0;
        let signedErrorSum = 0;
        let maxAbsDiff = 0;
        let referenceSum = 0;
        let candidateSum = 0;
        let referenceAbsSum = 0;

        for (const [referenceValue, candidateValue] of paired) {
          const diff = candidateValue - referenceValue;
          const absDiff = Math.abs(diff);
          absErrorSum += absDiff;
          squaredErrorSum += diff * diff;
          signedErrorSum += diff;
          maxAbsDiff = Math.max(maxAbsDiff, absDiff);
          referenceSum += referenceValue;
          candidateSum += candidateValue;
          referenceAbsSum += Math.abs(referenceValue);
        }

        const n = paired.length;
        const referenceMean = referenceSum / n;
        const candidateMean = candidateSum / n;
        let covariance = 0;
        let referenceVariance = 0;
        let candidateVariance = 0;

        for (const [referenceValue, candidateValue] of paired) {
          const referenceCentered = referenceValue - referenceMean;
          const candidateCentered = candidateValue - candidateMean;
          covariance += referenceCentered * candidateCentered;
          referenceVariance += referenceCentered * referenceCentered;
          candidateVariance += candidateCentered * candidateCentered;
        }

        const mae = absErrorSum / n;
        const rmse = Math.sqrt(squaredErrorSum / n);
        const bias = signedErrorSum / n;
        const referenceScale = Math.max(referenceAbsSum / n, 1);
        const normalizedRmse = rmse / referenceScale;
        // Use the union as the denominator so unmatched leading/trailing samples lower overlap
        // in full mode; Analyze common period removes those samples before this calculation.
        const unionSeconds = new Set([...referenceBySecond.keys(), ...candidateBySecond.keys()]);
        const fullUnionSeconds = new Set([...fullReferenceBySecond.keys(), ...fullCandidateBySecond.keys()]);
        const activeWindowSeconds = unionSeconds.size;
        const trimmedSeconds = Math.max(0, fullUnionSeconds.size - activeWindowSeconds);
        const overlapDenominator = Math.max(activeWindowSeconds, 1);
        const overlapPct = (n / overlapDenominator) * 100;
        const correlationDenominator = Math.sqrt(referenceVariance * candidateVariance);
        const correlation = correlationDenominator > 0 ? covariance / correlationDenominator : null;
        const shapeScore = correlation === null ? 0.5 : Math.max(0, Math.min(1, (correlation + 1) / 2));
        const errorScore = 1 / (1 + normalizedRmse);
        const biasScore = 1 / (1 + Math.abs(bias) / referenceScale);
        const overlapScore = Math.max(0, Math.min(1, overlapPct / 100));
        const similarityScore = (0.35 * shapeScore + 0.30 * errorScore + 0.15 * biasScore + 0.20 * overlapScore) * 100;

        return {
          pairedSamples: n,
          activeWindowSeconds,
          trimmedSeconds,
          overlapPct,
          similarityScore,
          correlation,
          mae,
          rmse,
          bias,
          maxAbsDiff
        };
      }

      function formatNumber(value, digits = 1) {
        if (value === null || value === undefined || !Number.isFinite(value)) return "-";
        return value.toFixed(digits);
      }

      function formatMetricValue(value, unit, digits = 1) {
        const formatted = formatNumber(value, digits);
        return formatted === "-" ? "-" : `${formatted} ${unit}`;
      }

      function normalizeSeriesForChart(series, trimBounds) {
        if (!series || !Array.isArray(series.data)) return { name: series ? series.name : "", data: [] };
        const seriesBounds = seriesTimeBounds(series);
        const elapsedStartTimestampMs = trimBounds ? trimBounds.minTimestampMs : (seriesBounds ? seriesBounds.minTimestampMs : null);

        const data = [];
        for (const point of series.data) {
          if (!Array.isArray(point) || point.length < 2) continue;
          const timestampMs = Number(point[0]);
          const value = Number(point[1]);
          if (!Number.isFinite(timestampMs) || !Number.isFinite(value)) continue;
          if (trimBounds && (timestampMs < trimBounds.minTimestampMs || timestampMs > trimBounds.maxTimestampMs)) continue;

          // Elapsed mode intentionally changes chart X from wall-clock timestamp to duration
          // so files can be visually compared from their activity/common-period start.
          const xValue = state.chartTimeMode === "elapsed" && elapsedStartTimestampMs !== null
            ? timestampMs - elapsedStartTimestampMs
            : timestampMs;
          data.push([xValue, value]);
        }

        return { name: series.name, data, color: normalizedFileColor(series.color) };
      }

      // Chart trimming mirrors the analytics mode so visual tails appear/disappear with the same
      // option that changes the table math, keeping charts and scores grounded in one window.
      function chartSeriesForMetric(metric) {
        const filesWithMetric = enabledFiles().filter(file => {
          const series = file.parsedSeries[metric];
          return series && Array.isArray(series.data) && series.data.length;
        });
        const trimBounds = state.trimToShortest ? commonMetricTimeBounds(filesWithMetric, metric) : null;

        return filesWithMetric
          .map(file => normalizeSeriesForChart({ ...file.parsedSeries[metric], color: file.color }, trimBounds))
          .filter(series => series.data.length);
      }

      function chartColorsForSeries(seriesList) {
        // ApexCharts colors are positional, so derive the array from the exact rendered series
        // order rather than from the full file list where hidden or metric-less files may appear.
        return seriesList.map(series => normalizedFileColor(series.color));
      }

      function chartBoundsForSeries(seriesList) {
        let minTimestampMs = Infinity;
        let maxTimestampMs = -Infinity;

        for (const series of seriesList) {
          for (const point of series.data || []) {
            const timestampMs = Array.isArray(point) ? Number(point[0]) : NaN;
            if (!Number.isFinite(timestampMs)) continue;
            minTimestampMs = Math.min(minTimestampMs, timestampMs);
            maxTimestampMs = Math.max(maxTimestampMs, timestampMs);
          }
        }

        if (!Number.isFinite(minTimestampMs) || !Number.isFinite(maxTimestampMs)) return {};
        return { min: minTimestampMs, max: maxTimestampMs };
      }

      function chartXAxisOptionsForSeries(seriesList) {
        const type = state.chartTimeMode === "elapsed" ? "numeric" : "datetime";
        return {
          ...chartXAxisBaseOptions(type),
          ...chartBoundsForSeries(seriesList)
        };
      }

      function activeAnnotations() {
        if (!state.annotationDraft) return state.annotations;
        return [
          ...state.annotations.filter(annotation => annotation.id !== state.annotationDraft.id),
          state.annotationDraft
        ];
      }

      function annotationChartRange(annotation, seriesList) {
        const chartBounds = chartBoundsForSeries(seriesList);
        if (!Number.isFinite(chartBounds.min) || !Number.isFinite(chartBounds.max)) return null;
        const sourceBounds = annotationSelectionBounds();
        const sourceStartMs = Math.min(annotation.startTimestampMs, annotation.endTimestampMs);
        const sourceEndMs = Math.max(annotation.startTimestampMs, annotation.endTimestampMs);
        const chartStart = state.chartTimeMode === "elapsed" && sourceBounds
          ? sourceStartMs - sourceBounds.minTimestampMs
          : sourceStartMs;
        const chartEnd = state.chartTimeMode === "elapsed" && sourceBounds
          ? sourceEndMs - sourceBounds.minTimestampMs
          : sourceEndMs;
        const visibleStart = Math.max(chartStart, chartBounds.min);
        const visibleEnd = Math.min(chartEnd, chartBounds.max);
        if (visibleEnd <= visibleStart) return null;
        return { x: visibleStart, x2: visibleEnd };
      }

      function annotationOptionsForSeries(seriesList) {
        const xaxis = activeAnnotations()
          .map(annotation => {
            const range = annotationChartRange(annotation, seriesList);
            if (!range) return null;
            const annotationColor = normalizedAnnotationColor(
              annotation.color,
              annotation.isDraft ? DEFAULT_DRAFT_ANNOTATION_COLOR : DEFAULT_ANNOTATION_COLOR
            );
            return {
              id: annotation.id,
              x: range.x,
              x2: range.x2,
              fillColor: annotationColor,
              opacity: annotation.isDraft ? 0.35 : 0.28,
              label: {
                text: annotation.name || "Annotation",
                style: {
                  color: "#222",
                  background: annotationColor
                }
              }
            };
          })
          .filter(annotation => annotation !== null);

        return { xaxis };
      }

      // Resetting axis bounds with the currently visible series prevents ApexCharts from keeping
      // stale zoom/range state after Analyze common period hides or restores leading/trailing data.
      async function updateChartSeries(chart, seriesList) {
        // Annotations are updated together with xaxis bounds so ApexCharts redraws the saved
        // x/x2 rectangles after series, trim mode, or chart-time coordinates change.
        await chart.updateOptions({
          colors: chartColorsForSeries(seriesList),
          xaxis: chartXAxisOptionsForSeries(seriesList),
          annotations: annotationOptionsForSeries(seriesList)
        }, false, false);
        await chart.updateSeries(seriesList);
      }

      async function updateChartAnnotations(chart, seriesList) {
        await chart.updateOptions({ annotations: annotationOptionsForSeries(seriesList) }, false, false);
      }

      function scheduleAnnotationPreviewUpdate() {
        if (annotationDragState.previewInFlight) {
          annotationDragState.previewPending = true;
          return;
        }
        if (annotationDragState.animationFrame !== null) {
          annotationDragState.previewPending = true;
          return;
        }
        // Dragging should repaint only the annotation layer once per animation frame; this keeps
        // handles responsive instead of recomputing chart series and analytics for each pointermove.
        // If ApexCharts is still applying the previous update, keep only the latest pending repaint
        // so fast drags do not build an expensive queue of stale overlay positions.
        annotationDragState.animationFrame = requestAnimationFrame(async () => {
          annotationDragState.animationFrame = null;
          annotationDragState.previewPending = false;
          annotationDragState.previewInFlight = true;
          try {
            await Promise.all([
              updateChartAnnotations(chartHr, renderedChartSeries.hr_bpm),
              updateChartAnnotations(chartSpeed, renderedChartSeries.speed_kmh),
              updateChartAnnotations(chartPower, renderedChartSeries.power_w)
            ]);
          } finally {
            annotationDragState.previewInFlight = false;
            if (annotationDragState.previewPending) scheduleAnnotationPreviewUpdate();
          }
        });
      }

      // Header tooltips keep analytical definitions close to the table so users can interpret
      // dense comparison metrics without leaving the current review workflow.
      function analyticsHeader(label) {
        const tooltip = ANALYTICS_COLUMN_HELP[label] || "";
        if (!tooltip) return escapeHtml(label);

        return `
          <span class="metricHeader">
            <span>${escapeHtml(label)}</span>
            <span class="metricHelp" tabindex="0" role="button" aria-label="${escapeAttribute(`${label}: ${tooltip}`)}" data-tooltip="${escapeAttribute(tooltip)}">?</span>
          </span>
        `;
      }

      function hideMetricTooltip() {
        ui.metricTooltip.classList.remove("visible");
        ui.metricTooltip.textContent = "";
      }

      // The tooltip is rendered outside the scrollable table because table overflow clips
      // header pseudo-elements; fixed positioning keeps descriptions visible at table edges.
      function showMetricTooltip(helpElement) {
        const tooltipText = helpElement.getAttribute("data-tooltip") || "";
        if (!tooltipText) return;

        ui.metricTooltip.textContent = tooltipText;
        ui.metricTooltip.classList.add("visible");

        const helpRect = helpElement.getBoundingClientRect();
        const tooltipRect = ui.metricTooltip.getBoundingClientRect();
        const viewportPadding = 12;
        const preferredLeft = helpRect.left + helpRect.width / 2 - tooltipRect.width / 2;
        const left = Math.min(
          Math.max(preferredLeft, viewportPadding),
          window.innerWidth - tooltipRect.width - viewportPadding
        );
        const preferredTop = helpRect.top - tooltipRect.height - 8;
        const top = preferredTop >= viewportPadding ? preferredTop : helpRect.bottom + 8;

        ui.metricTooltip.style.left = `${left}px`;
        ui.metricTooltip.style.top = `${top}px`;
      }

      function bindMetricTooltips(container) {
        container.querySelectorAll(".metricHelp").forEach(helpElement => {
          helpElement.addEventListener("mouseenter", () => showMetricTooltip(helpElement));
          helpElement.addEventListener("focus", () => showMetricTooltip(helpElement));
          helpElement.addEventListener("mouseleave", hideMetricTooltip);
          helpElement.addEventListener("blur", hideMetricTooltip);
        });
      }

      function isBestAnalyticsCell(rows, row, key, higherIsBetter) {
        const comparableRows = rows.filter(candidate => candidate.metric === row.metric && candidate[key] !== null && candidate[key] !== undefined && Number.isFinite(candidate[key]));
        if (!comparableRows.length || row[key] === null || row[key] === undefined || !Number.isFinite(row[key])) return false;
        const bestValue = comparableRows.reduce((best, candidate) => {
          return higherIsBetter ? Math.max(best, candidate[key]) : Math.min(best, candidate[key]);
        }, comparableRows[0][key]);
        return Math.abs(row[key] - bestValue) < 0.000001;
      }

      // Analytics are derived from enabled files only, so removing or disabling a file immediately
      // changes the evidence used by the comparison table and keeps it consistent with the charts.
      function buildAnalyticsRows(metric) {
        const files = enabledFiles();
        if (files.length < 2) return [];

        const rows = [];
        ensureReferenceKey();
        const referenceFile = currentReferenceFile();
        if (!referenceFile) return rows;
        const candidateFiles = files.filter(file => file.key !== referenceFile.key);

        const referenceSeries = referenceFile.parsedSeries[metric];
        if (!referenceSeries || !Array.isArray(referenceSeries.data) || !referenceSeries.data.length) return rows;
        const metricFiles = [referenceFile, ...candidateFiles].filter(file => {
          const series = file.parsedSeries[metric];
          return series && Array.isArray(series.data) && series.data.length;
        });
        const trimBounds = state.trimToShortest ? commonMetricTimeBounds(metricFiles, metric) : null;

        for (const candidateFile of candidateFiles) {
          const candidateSeries = candidateFile.parsedSeries[metric];
          if (!candidateSeries || !Array.isArray(candidateSeries.data) || !candidateSeries.data.length) continue;
          const metrics = compareSeries(referenceSeries, candidateSeries, { trimBounds });
          if (!metrics) continue;
          rows.push({
            metric,
            candidateName: candidateFile.name,
            ...metrics
          });
        }

        return rows;
      }

      function renderMetricAnalyticsTable(metric, rows) {
        const container = ui.analyticsTables[metric];
        if (!container) return;

        if (!rows.length) {
          container.innerHTML = `<div class="muted analyticsEmpty">Enable at least two files with overlapping ${escapeHtml(METRIC_LABELS[metric] || metric)} data to see comparison analytics.</div>`;
          return;
        }

        container.innerHTML = `
          <div class="analyticsTableWrap">
            <table>
              <thead>
                <tr>
                  <th>${analyticsHeader("Compared file")}</th>
                  <th>${analyticsHeader("Samples")}</th>
                  <th>${analyticsHeader("Window")}</th>
                  <th>${analyticsHeader("Trimmed")}</th>
                  <th>${analyticsHeader("Shared coverage")}</th>
                  <th>${analyticsHeader("Similarity")}</th>
                  <th>${analyticsHeader("Correlation")}</th>
                  <th>${analyticsHeader("MAE")}</th>
                  <th>${analyticsHeader("RMSE")}</th>
                  <th>${analyticsHeader("Bias")}</th>
                  <th>${analyticsHeader("Max diff")}</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map(row => {
                  const unit = METRIC_UNITS[row.metric];
                  const similarityClass = isBestAnalyticsCell(rows, row, "similarityScore", true) ? "bestCell" : "";
                  const correlationClass = isBestAnalyticsCell(rows, row, "correlation", true) ? "bestCell" : "";
                  const maeClass = isBestAnalyticsCell(rows, row, "mae", false) ? "bestCell" : "";
                  const rmseClass = isBestAnalyticsCell(rows, row, "rmse", false) ? "bestCell" : "";
                  const maxDiffClass = isBestAnalyticsCell(rows, row, "maxAbsDiff", false) ? "bestCell" : "";
                  return `
                    <tr>
                      <td title="${escapeAttribute(row.candidateName)}">${escapeHtml(row.candidateName)}</td>
                      <td>${row.pairedSamples}</td>
                      <td>${formatDurationSeconds(row.activeWindowSeconds)}</td>
                      <td>${formatDurationSeconds(row.trimmedSeconds)}</td>
                      <td>${formatNumber(row.overlapPct, 1)}%</td>
                      <td class="${similarityClass}">${formatNumber(row.similarityScore, 1)}%</td>
                      <td class="${correlationClass}">${formatNumber(row.correlation, 3)}</td>
                      <td class="${maeClass}">${formatMetricValue(row.mae, unit)}</td>
                      <td class="${rmseClass}">${formatMetricValue(row.rmse, unit)}</td>
                      <td>${formatMetricValue(row.bias, unit)}</td>
                      <td class="${maxDiffClass}">${formatMetricValue(row.maxAbsDiff, unit)}</td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;
        bindMetricTooltips(container);
      }

      function renderAnalyticsTables() {
        hideMetricTooltip();
        ui.analyticsStatus.textContent = analyticsStatusText();
        for (const metric of SUPPORTED_METRICS) {
          const rows = buildAnalyticsRows(metric);
          renderMetricAnalyticsTable(metric, rows);
        }
      }

      function makeAnnotationId() {
        return `annotation-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function nextAnnotationName() {
        // New annotations get a ready-to-save label so users can quickly add several intervals
        // while still avoiding duplicate default names after edits or deletes.
        const usedNames = new Set(state.annotations.map(annotation => String(annotation.name || "").trim()));
        let index = 1;
        while (usedNames.has(`Annotation ${index}`)) index += 1;
        return `Annotation ${index}`;
      }

      function defaultAnnotationDraft(existingAnnotation = null) {
        const bounds = annotationSelectionBounds();
        if (!bounds) return null;
        const startTimestampMs = existingAnnotation
          ? clampTimestampToBounds(existingAnnotation.startTimestampMs, bounds)
          : bounds.minTimestampMs;
        const endTimestampMs = existingAnnotation
          ? clampTimestampToBounds(existingAnnotation.endTimestampMs, bounds)
          : bounds.minTimestampMs + (bounds.maxTimestampMs - bounds.minTimestampMs) * 0.25;
        const color = existingAnnotation
          ? normalizedAnnotationColor(existingAnnotation.color)
          : DEFAULT_DRAFT_ANNOTATION_COLOR;

        return {
          id: existingAnnotation ? existingAnnotation.id : makeAnnotationId(),
          name: existingAnnotation ? existingAnnotation.name : nextAnnotationName(),
          startTimestampMs: Math.min(startTimestampMs, endTimestampMs),
          endTimestampMs: Math.max(startTimestampMs, endTimestampMs),
          color,
          isDraft: true
        };
      }

      function syncAnnotationFormFromDraft() {
        const bounds = annotationSelectionBounds();
        const draft = state.annotationDraft;
        if (!bounds || !draft) {
          ui.annotationStartLabel.textContent = "-";
          ui.annotationEndLabel.textContent = "-";
          return;
        }

        ui.annotationNameInput.value = draft.name;
        ui.annotationColorInput.value = normalizedAnnotationColor(draft.color, DEFAULT_DRAFT_ANNOTATION_COLOR);
        updateAnnotationSliderUi(
          sliderValueFromTimestamp(draft.startTimestampMs, bounds),
          sliderValueFromTimestamp(draft.endTimestampMs, bounds)
        );
        ui.annotationStartLabel.textContent = formatAnnotationTimestamp(draft.startTimestampMs);
        ui.annotationEndLabel.textContent = formatAnnotationTimestamp(draft.endTimestampMs);
      }

      function updateAnnotationSliderUi(startSliderValue, endSliderValue) {
        updateAnnotationSliderPlotPadding();
        const startPercent = Math.min(Math.max(startSliderValue / 10, 0), 100);
        const endPercent = Math.min(Math.max(endSliderValue / 10, 0), 100);
        const startPosition = `calc(var(--annotation-slider-left-pad, 8px) + (100% - var(--annotation-slider-left-pad, 8px) - var(--annotation-slider-right-pad, 8px)) * ${startPercent / 100})`;
        const endPosition = `calc(var(--annotation-slider-left-pad, 8px) + (100% - var(--annotation-slider-left-pad, 8px) - var(--annotation-slider-right-pad, 8px)) * ${endPercent / 100})`;
        ui.annotationStartHandle.style.left = startPosition;
        ui.annotationEndHandle.style.left = endPosition;
        ui.annotationRangeFill.style.left = `${startPercent}%`;
        ui.annotationRangeFill.style.width = `${Math.max(0, endPercent - startPercent)}%`;
        // The slider fill mirrors the draft color so the form and chart preview communicate the
        // same interval identity while the user edits the annotation.
        ui.annotationRangeFill.style.background = state.annotationDraft
          ? normalizedAnnotationColor(state.annotationDraft.color, DEFAULT_DRAFT_ANNOTATION_COLOR)
          : DEFAULT_ANNOTATION_COLOR;
        ui.annotationStartHandle.setAttribute("aria-valuenow", String(Math.round(startSliderValue)));
        ui.annotationEndHandle.setAttribute("aria-valuenow", String(Math.round(endSliderValue)));
      }

      function updateAnnotationSliderPlotPadding() {
        const sliderRect = ui.annotationRangeSlider.getBoundingClientRect();
        if (!sliderRect.width) return;

        const chartRoot = ["#chartHr", "#chartSpeed", "#chartPower"]
          .map(selector => document.querySelector(selector))
          .find(chartElement => {
            const gridElement = chartElement ? chartElement.querySelector(".apexcharts-grid") : null;
            return gridElement && gridElement.getBoundingClientRect().width > 0;
          });
        const chartCanvas = chartRoot ? chartRoot.querySelector(".apexcharts-canvas") : null;
        const chartGrid = chartRoot ? chartRoot.querySelector(".apexcharts-grid") : null;
        if (!chartCanvas || !chartGrid) {
          ui.annotationRangeSlider.style.setProperty("--annotation-slider-left-pad", "8px");
          ui.annotationRangeSlider.style.setProperty("--annotation-slider-right-pad", "8px");
          return;
        }

        const gridRect = chartGrid.getBoundingClientRect();
        if (!gridRect.width) return;

        // ApexCharts draws x-axis annotations inside the plot grid, not across the whole SVG.
        // Use page-coordinate offsets instead of proportional scaling so the timeline starts and
        // ends under the same visible columns as the chart plot area, avoiding a right-shifted track.
        const rawLeftPad = gridRect.left - sliderRect.left;
        const rawRightPad = sliderRect.right - gridRect.right;
        let leftPad = Math.max(8, rawLeftPad);
        let rightPad = Math.max(8, rawRightPad);
        const minimumTrackWidth = 80;
        if (leftPad + rightPad > sliderRect.width - minimumTrackWidth) {
          leftPad = 8;
          rightPad = 8;
        }
        ui.annotationRangeSlider.style.setProperty("--annotation-slider-left-pad", `${leftPad}px`);
        ui.annotationRangeSlider.style.setProperty("--annotation-slider-right-pad", `${rightPad}px`);
      }

      function syncAnnotationDraftFromSlider(startSliderValue, endSliderValue) {
        const bounds = annotationSelectionBounds();
        if (!bounds || !state.annotationDraft) return false;
        const startTimestampMs = timestampFromSliderValue(startSliderValue, bounds);
        const endTimestampMs = timestampFromSliderValue(endSliderValue, bounds);
        if (!Number.isFinite(startTimestampMs) || !Number.isFinite(endTimestampMs)) return false;

        // Keeping start/end ordered avoids invalid x/x2 ranges while still letting users adjust
        // both handles on one timeline-style control.
        state.annotationDraft.name = ui.annotationNameInput.value.trim();
        state.annotationDraft.startTimestampMs = Math.min(startTimestampMs, endTimestampMs);
        state.annotationDraft.endTimestampMs = Math.max(startTimestampMs, endTimestampMs);
        updateAnnotationSliderUi(
          sliderValueFromTimestamp(state.annotationDraft.startTimestampMs, bounds),
          sliderValueFromTimestamp(state.annotationDraft.endTimestampMs, bounds)
        );
        ui.annotationStartLabel.textContent = formatAnnotationTimestamp(state.annotationDraft.startTimestampMs);
        ui.annotationEndLabel.textContent = formatAnnotationTimestamp(state.annotationDraft.endTimestampMs);
        return true;
      }

      function currentAnnotationSliderValues() {
        const bounds = annotationSelectionBounds();
        if (!bounds || !state.annotationDraft) return null;
        return {
          start: sliderValueFromTimestamp(state.annotationDraft.startTimestampMs, bounds),
          end: sliderValueFromTimestamp(state.annotationDraft.endTimestampMs, bounds)
        };
      }

      function sliderValueFromPointerEvent(ev) {
        const trackElement = ui.annotationRangeSlider.querySelector(".timelineRangeTrack");
        const trackRect = trackElement ? trackElement.getBoundingClientRect() : ui.annotationRangeSlider.getBoundingClientRect();
        if (!trackRect.width) return 0;
        const rawRatio = (ev.clientX - trackRect.left) / trackRect.width;
        return Math.round(Math.min(Math.max(rawRatio, 0), 1) * 1000);
      }

      function moveAnnotationHandle(handleName, sliderValue) {
        const sliderValues = currentAnnotationSliderValues();
        if (!sliderValues) return false;
        const nextStartValue = handleName === "start"
          ? Math.min(sliderValue, sliderValues.end)
          : sliderValues.start;
        const nextEndValue = handleName === "end"
          ? Math.max(sliderValue, sliderValues.start)
          : sliderValues.end;
        return syncAnnotationDraftFromSlider(nextStartValue, nextEndValue);
      }

      function reconcileAnnotationDraftWithBounds() {
        if (!state.annotationDraft) return;
        const bounds = annotationSelectionBounds();
        if (!bounds) {
          // Without visible data there is no meaningful x-axis range to edit, so the transient
          // preview is closed instead of keeping sliders pointed at stale uploaded-file bounds.
          state.annotationDraft = null;
          ui.annotationForm.hidden = true;
          return;
        }

        state.annotationDraft.startTimestampMs = clampTimestampToBounds(state.annotationDraft.startTimestampMs, bounds);
        state.annotationDraft.endTimestampMs = clampTimestampToBounds(state.annotationDraft.endTimestampMs, bounds);
        if (state.annotationDraft.endTimestampMs < state.annotationDraft.startTimestampMs) {
          const previousStart = state.annotationDraft.startTimestampMs;
          state.annotationDraft.startTimestampMs = state.annotationDraft.endTimestampMs;
          state.annotationDraft.endTimestampMs = previousStart;
        }
        syncAnnotationFormFromDraft();
      }

      function placeAnnotationForm() {
        if (!state.annotationDraft) {
          ui.annotationsPanel.appendChild(ui.annotationForm);
          return;
        }

        const editingSavedAnnotation = state.annotations.some(annotation => annotation.id === state.annotationDraft.id);
        if (!editingSavedAnnotation) {
          // A new annotation should be edited after the saved list, while editing an existing one
          // should keep the controls inside that annotation's own block for clearer context.
          ui.annotationsPanel.appendChild(ui.annotationForm);
          syncAnnotationFormFromDraft();
          return;
        }

        const editedAnnotationRow = Array.from(ui.annotationsList.querySelectorAll(".annotationItem"))
          .find(row => row.getAttribute("data-annotation-id") === state.annotationDraft.id);
        if (editedAnnotationRow) editedAnnotationRow.appendChild(ui.annotationForm);
        syncAnnotationFormFromDraft();
      }

      function renderAnnotationsList() {
        const bounds = annotationSelectionBounds();
        ui.annotationsStatus.textContent = bounds
          ? ` · ${state.annotations.length} saved`
          : " · add files to choose a range";
        ui.addAnnotationBtn.disabled = !bounds;

        if (!state.annotations.length) {
          ui.annotationsList.innerHTML = `<div class="muted analyticsEmpty">No saved annotations</div>`;
          placeAnnotationForm();
          return;
        }

        ui.annotationsList.innerHTML = state.annotations.map(annotation => {
          const isEditingAnnotation = state.annotationDraft && state.annotationDraft.id === annotation.id;
          // The swatch connects saved rows with their chart rectangles so multiple annotations
          // remain distinguishable even before the user opens one for editing.
          const annotationColor = normalizedAnnotationColor(annotation.color);
          return `
            <div class="annotationItem" data-annotation-id="${escapeAttribute(annotation.id)}">
              <div class="annotationItemSummary ${isEditingAnnotation ? "hiddenWhileEditing" : ""}">
                <div class="annotationItemMeta">
                  <span class="annotationColorSwatch" style="--annotation-color: ${escapeAttribute(annotationColor)}" aria-hidden="true"></span>
                  <span class="annotationItemName">${escapeHtml(annotation.name || "Annotation")}</span>
                  <span class="muted">${escapeHtml(formatAnnotationTimestamp(annotation.startTimestampMs))} - ${escapeHtml(formatAnnotationTimestamp(annotation.endTimestampMs))}</span>
                </div>
                <div class="actions">
                  <button class="btnSmall" data-action="edit-annotation">Edit</button>
                  <button class="btnSmall" data-action="delete-annotation">Delete</button>
                </div>
              </div>
            </div>
          `;
        }).join("");

        ui.annotationsList.querySelectorAll(".annotationItem").forEach(row => {
          row.addEventListener("click", async (ev) => {
            const target = ev.target;
            if (!(target instanceof HTMLElement)) return;
            const action = target.getAttribute("data-action");
            if (!action) return;
            const annotationId = row.getAttribute("data-annotation-id");
            if (!annotationId) return;

            if (action === "edit-annotation") {
              // Editing reuses the same explicit form as Add, avoiding transient prompt labels
              // and making the live chart preview available for saved ranges too.
              const annotation = state.annotations.find(item => item.id === annotationId);
              if (!annotation) return;
              state.annotationDraft = defaultAnnotationDraft(annotation);
              ui.annotationForm.hidden = false;
              ui.annotationFormError.textContent = "";
              syncAnnotationFormFromDraft();
              await updateChartsFromState();
              return;
            }

            if (action === "delete-annotation") {
              // Delete removes the saved range from every chart immediately so stale highlighted
              // regions cannot be mistaken for current comparison evidence.
              state.annotations = state.annotations.filter(annotation => annotation.id !== annotationId);
              if (state.annotationDraft && state.annotationDraft.id === annotationId) state.annotationDraft = null;
              ui.annotationForm.hidden = state.annotationDraft === null;
              renderAnnotationsList();
              await updateChartsFromState();
            }
          });
        });
        placeAnnotationForm();
      }

      async function updateChartsFromState() {
        reconcileAnnotationDraftWithBounds();
        const hrSeries = chartSeriesForMetric("hr_bpm");
        const speedSeries = chartSeriesForMetric("speed_kmh");
        const powerSeries = chartSeriesForMetric("power_w");
        renderedChartSeries.hr_bpm = hrSeries;
        renderedChartSeries.speed_kmh = speedSeries;
