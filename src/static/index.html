        renderedChartSeries.power_w = powerSeries;
        await updateChartSeries(chartHr, hrSeries);
        await updateChartSeries(chartSpeed, speedSeries);
        await updateChartSeries(chartPower, powerSeries);
        renderAnalyticsTables();
        renderAnnotationsList();
      }

      ui.addFilesBtn.addEventListener("click", () => {
        ui.fileInput.click();
      });

      ui.fileInput.addEventListener("change", async () => {
        const files = ui.fileInput.files;
        if (files && files.length) {
          await addSelectedFiles(files);
        }
        ui.fileInput.value = "";
      });

      ui.trimToShortestInput.addEventListener("change", async () => {
        // Trim mode changes both the score window and the chart window, so users can visually
        // confirm which leading/trailing samples are included in the comparison.
        state.trimToShortest = ui.trimToShortestInput.checked;
        await updateChartsFromState();
      });

      ui.chartTimeModeSelect.addEventListener("change", async () => {
        // Changing the chart time mode only remaps X values, leaving parsed activity samples and
        // analytics scores intact while giving users either wall-clock or elapsed-time inspection.
        currentChartTimeMode = ui.chartTimeModeSelect.value;
        state.chartTimeMode = ui.chartTimeModeSelect.value;
        syncAnnotationFormFromDraft();
        await updateChartsFromState();
      });

      ui.addAnnotationBtn.addEventListener("click", async () => {
        const draft = defaultAnnotationDraft();
        if (!draft) return;
        // Add opens a persistent editor because named analysis intervals must be visible and
        // adjustable before they become saved annotations on all metric charts.
        state.annotationDraft = draft;
        ui.annotationForm.hidden = false;
        ui.annotationFormError.textContent = "";
        syncAnnotationFormFromDraft();
        ui.annotationNameInput.focus();
        await updateChartsFromState();
      });

      ui.annotationNameInput.addEventListener("input", async () => {
        if (!state.annotationDraft) return;
        // Label edits only affect the annotation overlay text, so avoid rebuilding chart series
        // and tables while the user types.
        state.annotationDraft.name = ui.annotationNameInput.value.trim();
        scheduleAnnotationPreviewUpdate();
      });

      ui.annotationColorInput.addEventListener("input", async () => {
        if (!state.annotationDraft) return;
        // Color edits should repaint the annotation overlay immediately so users can choose a
        // distinguishable interval color without saving and reopening the annotation.
        state.annotationDraft.color = normalizedAnnotationColor(ui.annotationColorInput.value, DEFAULT_DRAFT_ANNOTATION_COLOR);
        const sliderValues = currentAnnotationSliderValues();
        if (sliderValues) updateAnnotationSliderUi(sliderValues.start, sliderValues.end);
        scheduleAnnotationPreviewUpdate();
      });

      function startAnnotationHandleDrag(handleName, ev, captureElement = null) {
        if (!state.annotationDraft) return;
        annotationDragState.activeHandle = handleName;
        const handleElement = handleName === "start" ? ui.annotationStartHandle : ui.annotationEndHandle;
        const dragCaptureElement = captureElement || handleElement;
        handleElement.classList.add("dragging");
        annotationDragState.capturedElement = dragCaptureElement;
        dragCaptureElement.setPointerCapture(ev.pointerId);
        moveAnnotationHandle(handleName, sliderValueFromPointerEvent(ev));
        scheduleAnnotationPreviewUpdate();
      }

      ui.annotationStartHandle.addEventListener("pointerdown", (ev) => {
        // Pointer dragging gives one shared timeline control with two handles, matching the range
        // selection mental model while avoiding the slow double native-slider rerender path.
        startAnnotationHandleDrag("start", ev);
      });

      ui.annotationEndHandle.addEventListener("pointerdown", (ev) => {
        startAnnotationHandleDrag("end", ev);
      });

      ui.annotationRangeSlider.addEventListener("pointerdown", (ev) => {
        if (!state.annotationDraft || ev.target === ui.annotationStartHandle || ev.target === ui.annotationEndHandle) return;
        const sliderValues = currentAnnotationSliderValues();
        if (!sliderValues) return;
        const clickedValue = sliderValueFromPointerEvent(ev);
        const nearestHandle = Math.abs(clickedValue - sliderValues.start) <= Math.abs(clickedValue - sliderValues.end) ? "start" : "end";
        startAnnotationHandleDrag(nearestHandle, ev, ui.annotationRangeSlider);
      });

      ui.annotationRangeSlider.addEventListener("pointermove", (ev) => {
        if (!annotationDragState.activeHandle) return;
        if (!moveAnnotationHandle(annotationDragState.activeHandle, sliderValueFromPointerEvent(ev))) return;
        scheduleAnnotationPreviewUpdate();
      });

      ui.annotationRangeSlider.addEventListener("pointerup", (ev) => {
        if (!annotationDragState.activeHandle) return;
        const handleElement = annotationDragState.activeHandle === "start" ? ui.annotationStartHandle : ui.annotationEndHandle;
        handleElement.classList.remove("dragging");
        if (annotationDragState.capturedElement && annotationDragState.capturedElement.hasPointerCapture(ev.pointerId)) {
          annotationDragState.capturedElement.releasePointerCapture(ev.pointerId);
        }
        annotationDragState.activeHandle = null;
        annotationDragState.capturedElement = null;
      });

      ["pointercancel", "lostpointercapture"].forEach(eventName => {
        ui.annotationRangeSlider.addEventListener(eventName, () => {
          ui.annotationStartHandle.classList.remove("dragging");
          ui.annotationEndHandle.classList.remove("dragging");
          annotationDragState.activeHandle = null;
          annotationDragState.capturedElement = null;
        });
      });

      ui.saveAnnotationBtn.addEventListener("click", async () => {
        if (!state.annotationDraft) return;
        state.annotationDraft.name = ui.annotationNameInput.value.trim();
        state.annotationDraft.color = normalizedAnnotationColor(ui.annotationColorInput.value, DEFAULT_DRAFT_ANNOTATION_COLOR);
        const draft = state.annotationDraft;
        if (!draft.name) {
          ui.annotationFormError.textContent = "Enter annotation name";
          return;
        }
        if (draft.endTimestampMs <= draft.startTimestampMs) {
          ui.annotationFormError.textContent = "Choose a non-empty range";
          return;
        }

        // Saving strips the draft marker so the preview color becomes the stable saved annotation
        // color and the same object can be edited or deleted from the list later.
        const savedAnnotation = {
          id: draft.id,
          name: draft.name,
          startTimestampMs: draft.startTimestampMs,
          endTimestampMs: draft.endTimestampMs,
          color: draft.color
        };
        const existingIndex = state.annotations.findIndex(annotation => annotation.id === savedAnnotation.id);
        if (existingIndex >= 0) {
          state.annotations.splice(existingIndex, 1, savedAnnotation);
        } else {
          state.annotations.push(savedAnnotation);
        }

        state.annotationDraft = null;
        ui.annotationForm.hidden = true;
        ui.annotationFormError.textContent = "";
        renderAnnotationsList();
        await updateChartsFromState();
      });

      ui.cancelAnnotationBtn.addEventListener("click", async () => {
        // Cancel removes only the transient preview, preserving already saved annotations and
        // immediately clearing the draft rectangle from every chart.
        state.annotationDraft = null;
        ui.annotationForm.hidden = true;
        ui.annotationFormError.textContent = "";
        await updateChartsFromState();
      });

      ui.enableAllBtn.addEventListener("click", async () => {
        for (const item of state.files.values()) item.enabled = true;
        ensureReferenceKey();
        renderFilesList();
        await updateChartsFromState();
      });

      ui.disableAllBtn.addEventListener("click", async () => {
        for (const item of state.files.values()) item.enabled = false;
        ensureReferenceKey();
        renderFilesList();
        await updateChartsFromState();
      });

      ui.clearBtn.addEventListener("click", async () => {
        state.files.clear();
        state.referenceKey = null;
        state.annotationDraft = null;
        // Clear resets analysis context entirely; keeping timestamp annotations after all source
        // files are removed would make the next upload inherit unrelated highlighted intervals.
        state.annotations = [];
        renderFilesList();
        await updateChartsFromState();
      });

      // Hide floating tooltips during viewport changes because their fixed position is calculated
      // from the old header coordinates and would otherwise point to the wrong column.
      window.addEventListener("scroll", hideMetricTooltip, true);
      window.addEventListener("resize", () => {
        hideMetricTooltip();
        // Resizing changes both ApexCharts plot offsets and the editor width, so recompute the
        // timeline padding to keep slider handles vertically aligned with chart annotations.
        syncAnnotationFormFromDraft();
      });

      renderFilesList();
      renderAnalyticsTables();
      renderAnnotationsList();
    </script>
  </body>
</html>
